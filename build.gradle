plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '6.23.0'
}

group = 'com.testp'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
	implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'
	implementation 'jakarta.el:jakarta.el-api:5.0.0'
	implementation 'org.glassfish.expressly:expressly:5.0.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	implementation 'org.openapitools.openapidiff:openapi-diff-cli:2.1.0-beta.1'
}


tasks.named('test') {
	useJUnitPlatform()
}

spotless {
	java {
		target 'src/**/*.java'
		//step 1: Apply Google Java Style Guide
		googleJavaFormat()

		//Rule 1: place opening braces on the next line
		replaceRegex('Place braces on next line', '\\) \\{', ') {\n')

		//Rule 2: Add blank lines around methods (except first/last method
		replaceRegex('Add blank lines around methods',
				'(\\})\\n( *(public|protected|private|static|\\s*void))', '$1\n\n$2')

		//Rule 3: Remove extra blank lines (reduce multiple blank lines to one)
		replaceRegex('Remove extra blank lines', '(\\n{2,})', '\n\n')

		//Rule 4: Ensure single blank line after imports
		replaceRegex('Ensure single blank line after imports', '(import [\\w.]+;)((?!\\n).)', '$1\n')

		//Rule 5: Remove blank line after opening brace
		replaceRegex('Remove blank line after braces', '\\{\\n\\n', '{\n')

		//Rule 6: Remove leading/trailing whitespace from lines
		replaceRegex('Remove leading/trailing whitespace from lines', '[ \\t]+$', '')

		//Rule 7:  Restrict wildcard imports
		replaceRegex('Restrict wildcard imports', 'import (.*)\\.\\*;', '// Avoid wildcard imports: $1.*')

		//Rule 8: Indentation (4 spaces)
		indentWithSpaces(4) // Ensures all indentations use 4 spaves

        // step 3: Remove unused imports
		removeUnusedImports()

        // step 4: Ensure files end with a newline
		endWithNewline()
	}

	format('misc') {
		// Apply formatting rules for non-Java files
		target '*.gradle', '*.md', '*.properties'
		trimTrailingWhitespace()
		endWithNewline()
	}
}


tasks.named('build').configure {
	dependsOn 'spotlessCheck'
}

tasks.named('build').configure {
	dependsOn 'compareOpenApi'
}


configurations {
	openapiDiff
}


dependencies {
	openapiDiff 'org.openapitools.openapidiff:openapi-diff-cli:2.1.0-beta.1'
}


import java.time.LocalDateTime
import java.time.format.DateTimeFormatter

tasks.register('compareOpenApi', JavaExec) {
	group = 'verification'
	description = 'Compare old and new OpenAPI contracts and append markdown diff with version/date header'

	mainClass.set('org.openapitools.openapidiff.cli.Main')
	classpath = configurations.openapiDiff

	// Temporary diff file
	def tempDiffFile = file("api-contracts/openapi-diff-temp.md")
	def changelogFile = file("api-contracts/changelog.md")

	// Command-line args for OpenAPI diff
	args = [
			'api-contracts/openapi-v1.json',
			'api-contracts/openapi-latest.json',
			'--markdown', tempDiffFile.absolutePath
	]

	doLast {
		// Ensure changelog file exists
		if (!changelogFile.exists()) {
			changelogFile.parentFile.mkdirs()
			changelogFile.text = "# API Change Log\n\n"
		}

		// Add version + date header
		def date = LocalDateTime.now().format(DateTimeFormatter.ofPattern("yyyy-MM-dd HH:mm:ss"))
		def header = "\n## Version ${project.version} — ${date}\n\n"

		// Append diff content if the diff file exists
		if (tempDiffFile.exists()) {
			changelogFile.append(header)
			changelogFile.append(tempDiffFile.text)
			changelogFile.append("\n---\n")
			println("✅ OpenAPI diff appended to ${changelogFile}")
		} else {
			println("⚠️ No diff output found to append.")
		}
	}
}
