plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '6.23.0'
	id 'org.springdoc.openapi-gradle-plugin' version '1.8.0'
}

group = 'com.testp'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
	implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'
	implementation 'jakarta.el:jakarta.el-api:5.0.0'
	implementation 'org.glassfish.expressly:expressly:5.0.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	implementation 'org.openapitools.openapidiff:openapi-diff-cli:2.1.0-beta.1'
}


tasks.named('test') {
	useJUnitPlatform()
}

spotless {
	java {
		target 'src/**/*.java'
		//step 1: Apply Google Java Style Guide
		googleJavaFormat()

		//Rule 1: place opening braces on the next line
		replaceRegex('Place braces on next line', '\\) \\{', ') {\n')

		//Rule 2: Add blank lines around methods (except first/last method
		replaceRegex('Add blank lines around methods',
				'(\\})\\n( *(public|protected|private|static|\\s*void))', '$1\n\n$2')

		//Rule 3: Remove extra blank lines (reduce multiple blank lines to one)
		replaceRegex('Remove extra blank lines', '(\\n{2,})', '\n\n')

		//Rule 4: Ensure single blank line after imports
		replaceRegex('Ensure single blank line after imports', '(import [\\w.]+;)((?!\\n).)', '$1\n')

		//Rule 5: Remove blank line after opening brace
		replaceRegex('Remove blank line after braces', '\\{\\n\\n', '{\n')

		//Rule 6: Remove leading/trailing whitespace from lines
		replaceRegex('Remove leading/trailing whitespace from lines', '[ \\t]+$', '')

		//Rule 7:  Restrict wildcard imports
		replaceRegex('Restrict wildcard imports', 'import (.*)\\.\\*;', '// Avoid wildcard imports: $1.*')

		//Rule 8: Indentation (4 spaces)
		indentWithSpaces(4) // Ensures all indentations use 4 spaves

        // step 3: Remove unused imports
		removeUnusedImports()

        // step 4: Ensure files end with a newline
		endWithNewline()
	}

	format('misc') {
		// Apply formatting rules for non-Java files
		target '*.gradle', '*.md', '*.properties'
		trimTrailingWhitespace()
		endWithNewline()
	}
}


tasks.named('build').configure {
	dependsOn 'spotlessCheck'
}

tasks.named('build').configure {
	dependsOn 'compareOpenApi'
}


configurations {
	openapiDiff
}


dependencies {
	openapiDiff 'org.openapitools.openapidiff:openapi-diff-cli:2.1.0-beta.1'
}

import groovy.json.*
import java.net.HttpURLConnection
import java.net.URL
import java.nio.charset.StandardCharsets
import java.time.LocalDateTime
import java.time.format.DateTimeFormatter
import java.time.LocalDateTime
import java.time.format.DateTimeFormatter
def geminiApiKey = System.getenv("GEMINI_API_KEY")


tasks.register('compareOpenApi1', JavaExec) {
	group = 'verification'
	description = 'Compare old and new OpenAPI contracts and append markdown diff with version/date header'

	mainClass.set('org.openapitools.openapidiff.cli.Main')
	classpath = configurations.openapiDiff

	// Temporary diff file
	def tempDiffFile = file("api-contracts/openapi-diff-temp.md")
	def changelogFile = file("api-contracts/changelog.md")

	// Command-line args for OpenAPI diff
	args = [
			'api-contracts/openapi-v1.json',
			'api-contracts/openapi-latest.json',
			'--markdown', tempDiffFile.absolutePath
	]

	doLast {
		if (!changelogFile.exists()) {
			changelogFile.parentFile.mkdirs()
			changelogFile.text = "# API Change Log\n\n"
		}

		// Prepare today's date (date only, not time, for section matching)
		def date = LocalDateTime.now().format(DateTimeFormatter.ofPattern("yyyy-MM-dd"))
		def fullDate = LocalDateTime.now().format(DateTimeFormatter.ofPattern("yyyy-MM-dd HH:mm:ss"))
		def header = "## Version ${project.version} — ${fullDate}"

		// Read diff content
		def diffContent = tempDiffFile.exists() ? tempDiffFile.text.trim() : ""
		def entryContent = "${header}\n\n" + (diffContent ? diffContent : "No Change in API contract") + "\n---\n"

		// Read changelog content
		def changelogText = changelogFile.text

		// Regex to match a section for the current date (date only, not time)
		def sectionPattern = ~/(?ms)^## Version [^\n]+ — ${date}[^\n]*\n.*?\n---\n/

		if (changelogText =~ sectionPattern) {
			// Section for today exists, replace it
			changelogText = changelogText.replaceFirst(sectionPattern, entryContent)
			// Move today's section to the top (in case it was not already)
			// Remove today's section from anywhere else, then prepend
			changelogText = changelogText.replaceFirst(sectionPattern, "")
			changelogFile.text = "# API Change Log\n\n" + entryContent + changelogText.replaceFirst(/^# API Change Log\n\n/, "")
			println("♻️ Overwrote today's API change log section in ${changelogFile} (and moved to top)")
		} else {
			// Section for today does not exist, prepend as latest
			changelogFile.text = "# API Change Log\n\n" + entryContent + changelogText.replaceFirst(/^# API Change Log\n\n/, "")
			println("✅ Prepended new API change log section to ${changelogFile}")
		}
	}
}


openApi {
	apiDocsUrl.set("http://localhost:8080/v3/api-docs") // fallback if you run app
	outputDir.set(file("api-contracts"))
	outputFileName.set("openapi-latest.json")
//	format.set("json")
	waitTimeInSeconds.set(10)
	customBootRun {
		args.set(["--spring.profiles.active=default"])
	}
}


// Fix Gradle strict dependency validation for forkedSpringBootRun
tasks.named("forkedSpringBootRun") {
	doNotTrackState("Accessing workingDir is not supported in Gradle 8+")
	dependsOn("classes", "bootJar", "jar")
	mustRunAfter("test", "compileTestJava")

	// 🧩 Add these for Spotless
	dependsOn("spotlessJava", "spotlessMisc", "spotlessInternalRegisterDependencies")
}


def summarizeWithGemini(String diffContent) {
	if (!diffContent) return "No API changes detected."

	try {
		println("🤖 Summarizing changes with Gemini API...")
		def apiKey = System.getenv("GEMINI_API_KEY")
		apiKey=GEMINI_API_KEY='AIzaSyBFK6Kz9-RIykxaZbd7cWDFjr5ZXXMDau0'
		if (!apiKey) {
			println("⚠️ Gemini API key not found. Set GEMINI_API_KEY : ${GEMINI_API_KEY} environment variable.")
			return "Gemini summary unavailable (no API key)."
		}

		def apiUrl = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}"
		def payload = [
				contents: [[
								   parts: [[
												   text: "Summarize this OpenAPI diff in concise business terms (one paragraph, markdown ready):\n\n${diffContent}"
										   ]]
						   ]]
		]
		def conn = new URL(apiUrl).openConnection() as HttpURLConnection
		conn.setRequestMethod("POST")
		conn.setRequestProperty("Content-Type", "application/json")
		conn.doOutput = true
		conn.outputStream.withWriter(StandardCharsets.UTF_8.name()) {
			it.write(groovy.json.JsonOutput.toJson(payload))
		}

		def responseText = conn.inputStream.getText(StandardCharsets.UTF_8.name())
		def responseJson = new groovy.json.JsonSlurper().parseText(responseText)
		def summary = responseJson?.candidates?.getAt(0)?.content?.parts?.getAt(0)?.text ?: "No summary returned."

		return "### 🧠 Gemini Summary\n\n${summary}\n"
	} catch (Exception e) {
		println("❌ Gemini summarization failed: ${e.message}")
		return "Gemini summary unavailable due to error."
	}
}

def updateChangelog(File changelogFile, String diffContent, String summaryContent) {
	if (!changelogFile.exists()) {
		changelogFile.parentFile.mkdirs()
		changelogFile.text = "# API Change Log\n\n"
	}

	def date = LocalDateTime.now().format(DateTimeFormatter.ofPattern("yyyy-MM-dd"))
	def fullDate = LocalDateTime.now().format(DateTimeFormatter.ofPattern("yyyy-MM-dd HH:mm:ss"))
	def header = "## Version ${project.version} — ${fullDate}"

	def entryContent = "${header}\n\n${summaryContent}\n${diffContent ?: 'No Change in API contract'}\n---\n"
	def changelogText = changelogFile.text
	def sectionPattern = ~/(?ms)^## Version [^\n]+ — ${date}[^\n]*\n.*?\n---\n/

	if (changelogText =~ sectionPattern) {
		// Replace today's section and move to top
		changelogText = changelogText.replaceFirst(sectionPattern, "")
		changelogFile.text = "# API Change Log\n\n" + entryContent + changelogText.replaceFirst(/^# API Change Log\n\n/, "")
		println("♻️ Overwrote today's API change log section in ${changelogFile} (and moved to top)")
	} else {
		changelogFile.text = "# API Change Log\n\n" + entryContent + changelogText.replaceFirst(/^# API Change Log\n\n/, "")
		println("✅ Prepended new API change log section to ${changelogFile}")
	}
}

def getApiDiff(File tempDiffFile) {
	// This step already happens through openapi-diff CLI
	if (tempDiffFile.exists()) {
		println("✅ Diff generated at: ${tempDiffFile}")
	} else {
		println("⚠️ No diff file generated.")
	}
	return tempDiffFile.text.trim()
}
tasks.register('compareOpenApi', JavaExec) {
	group = 'verification'
	description = 'Compare old and new OpenAPI contracts, summarize via Gemini, and append markdown diff with version/date header'

	mainClass.set('org.openapitools.openapidiff.cli.Main')
	classpath = configurations.openapiDiff

	def tempDiffFile = file("api-contracts/openapi-diff-temp.md")
	def changelogFile = file("api-contracts/changelog.md")

	args = [
			'api-contracts/openapi-v1.json',
			'api-contracts/openapi-latest.json',
			'--markdown', tempDiffFile.absolutePath
	]

	doLast {
		def diffContent = getApiDiff(tempDiffFile)
		def summaryContent = summarizeWithGemini(diffContent)
		updateChangelog(changelogFile, diffContent, summaryContent)
	}
}

tasks.named("generateOpenApiDocs") {
	dependsOn("spotlessApply", "classes")
	mustRunAfter("test")
}

tasks.named('compareOpenApi') {
	dependsOn 'generateOpenApiDocs'
}
